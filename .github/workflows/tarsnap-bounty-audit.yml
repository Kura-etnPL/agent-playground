name: Tarsnap bounty audit

on:
  push:
    branches:
      - audit/tarsnap-bounty-20260823
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tarsnap-bounty-audit.yml'
      - 'tools/tarsnap_audit.py'
      - 'tools/tarsnap_keyfile_fuzz.py'
      - 'tools/tarsnap_cachedir_fuzz.py'
      - 'tools/tarsnap_cache_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARSNAP_SHA: 0bf0b299fed91139044c81cc6fcdc5521c34d235
    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@v4

      - name: Install analysis toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang \
            libacl1-dev libattr1-dev libbz2-dev libext2fs-dev liblzma-dev \
            libssl-dev libtool pkg-config python3 zlib1g-dev

      - name: Fetch pinned Tarsnap source
        run: |
          git clone https://github.com/Tarsnap/tarsnap.git tarsnap
          cd tarsnap
          git checkout "$TARSNAP_SHA"
          test "$(git rev-parse HEAD)" = "$TARSNAP_SHA"
          git status --short
          cd ..
          tar -czf tarsnap-pinned-source.tar.gz tarsnap

      - name: Validate audit tooling
        run: |
          python3 tools/tarsnap_audit.py tarsnap --output audit-candidates.md
          python3 -m py_compile \
            tools/tarsnap_audit.py \
            tools/tarsnap_keyfile_fuzz.py \
            tools/tarsnap_cachedir_fuzz.py

      - name: Configure and build with ASan and UBSan
        shell: bash
        run: |
          set -o pipefail
          cd tarsnap
          autoreconf -fi 2>&1 | tee ../autoreconf.log
          ./configure \
            CC=clang \
            CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined' \
            2>&1 | tee ../configure-sanitizers.log
          make -j2 2>&1 | tee ../build-sanitizers.log

      - name: Run upstream tests under sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          cd tarsnap
          make check 2>&1 | tee ../tests-sanitizers.log

      - name: Mutate an initialized cachedir under sanitizers
        id: cachedir_fuzz
        continue-on-error: true
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          python3 tools/tarsnap_cachedir_fuzz.py \
            --binary tarsnap/tarsnap \
            --keyfile tarsnap/tests/fake.keys \
            --sample tarsnap/tests/test_tarsnap.sh \
            --iterations 3000 \
            --timeout 3.0 \
            --output cachedir-fuzz-out \
            2>&1 | tee cachedir-fuzz.log

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          {
            echo '# Tarsnap cachedir audit summary'
            echo
            echo "Pinned revision: $TARSNAP_SHA"
            echo
            cat cachedir-fuzz-out/summary.md 2>/dev/null || true
            echo
            echo '## Sanitizer signals'
            grep -RniE 'AddressSanitizer|UndefinedBehaviorSanitizer|runtime error:|heap-use-after-free|double free|buffer-overflow|SEGV|ABRT|Assertion' \
              ./*.log cachedir-fuzz-out/*.stderr 2>/dev/null | head -n 300 || true
          } > audit-summary.md
          cat audit-summary.md

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarsnap-bounty-audit-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            audit-candidates.md
            audit-summary.md
            autoreconf.log
            configure-sanitizers.log
            build-sanitizers.log
            tests-sanitizers.log
            cachedir-fuzz.log
            cachedir-fuzz-out/
            tarsnap-pinned-source.tar.gz
